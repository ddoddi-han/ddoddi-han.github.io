<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 780" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Solji Han's Project Timeline</title>
  <desc id="desc">A diagram of the project progression from XTD in March 2022 through DPS, DD, SMR, and VIPER, with project periods through July 2026</desc>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="138%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#5b21b6" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect width="1180" height="780" rx="20" fill="#ffffff" />
  <g transform="translate(0,-45)">
  <path d="M 56 96 H 1120 V 154 H 156 V 775 H 56 Z" fill="#f8f5ff" stroke="#ede7fb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif">
    <text x="106" y="132" fill="#6d28d9" font-size="22" font-weight="600" text-anchor="middle">PERIOD</text>
    <text x="252" y="132" fill="#4c1d95" font-size="22" font-weight="600" text-anchor="middle">XTD</text>
    <text x="430" y="132" fill="#4c1d95" font-size="22" font-weight="600" text-anchor="middle">DPS</text>
    <text x="610" y="132" fill="#7c5426" font-size="22" font-weight="600" text-anchor="middle">DD</text>
    <text x="790" y="132" fill="#4c1d95" font-size="22" font-weight="600" text-anchor="middle">SMR</text>
    <text x="990" y="132" fill="#4c1d95" font-size="22" font-weight="600" text-anchor="middle">VIPER</text>
  </g>

  <g stroke="#efe7fb" stroke-width="1">
    <line x1="156" y1="190" x2="1120" y2="190" />
    <line x1="156" y1="300" x2="1120" y2="300" />
    <line x1="156" y1="345" x2="1120" y2="345" />
    <line x1="156" y1="435" x2="1120" y2="435" />
    <line x1="156" y1="555" x2="1120" y2="555" />
    <line x1="156" y1="645" x2="1120" y2="645" />
    <line x1="156" y1="690" x2="1120" y2="690" />
    <line x1="156" y1="745" x2="1120" y2="745" />
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" fill="#7e7190" font-size="18">
    <text x="72" y="194">2022.03</text>
    <text x="72" y="304">2023.11</text>
    <text x="72" y="349">2024.02</text>
    <text x="72" y="439">2024.11</text>
    <text x="72" y="559">2025.05</text>
    <text x="72" y="649">2025.11</text>
    <text x="72" y="694">2026.03</text>
    <text x="72" y="749">2026.07</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="252" y1="190" x2="252" y2="745" stroke="#7c3aed" stroke-width="9" />
    <line x1="430" y1="345" x2="430" y2="690" stroke="#a855f7" stroke-width="8" />
    <line x1="610" y1="300" x2="610" y2="435" stroke="#f59e0b" stroke-width="7" />
    <line x1="790" y1="555" x2="790" y2="745" stroke="#9333ea" stroke-width="8" />
    <line x1="990" y1="645" x2="990" y2="745" stroke="#8b5cf6" stroke-width="8" />

    <path d="M 252 345 C 300 345, 350 345, 430 345" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow-purple)" />
    <path d="M 252 555 C 420 555, 610 555, 790 555" stroke="#9333ea" stroke-width="3" marker-end="url(#arrow-purple)" />
    <path d="M 610 435 C 640 480, 700 530, 790 555" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 7" />
    <path d="M 430 690 C 370 690, 310 690, 252 690" stroke="#c084fc" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-purple)" />
  </g>

  <g filter="url(#softShadow)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif">
    <rect x="178" y="202" width="148" height="56" rx="12" fill="#f3edff" stroke="#c4b5fd" />
    <text x="252" y="228" text-anchor="middle" fill="#241b2f" font-size="18" font-weight="800">XTD v1</text>
    <text x="252" y="245" text-anchor="middle" fill="#7e7190" font-size="14">Initial build</text>

    <rect x="178" y="312" width="148" height="56" rx="12" fill="#f3edff" stroke="#c4b5fd" />
    <text x="252" y="338" text-anchor="middle" fill="#241b2f" font-size="18" font-weight="800">XTD v2</text>
    <text x="252" y="355" text-anchor="middle" fill="#7e7190" font-size="14">Feature expansion</text>

    <rect x="168" y="490" width="168" height="68" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" />
    <text x="252" y="520" text-anchor="middle" fill="#241b2f" font-size="18" font-weight="800">XTD v3</text>
    <text x="252" y="542" text-anchor="middle" fill="#6d28d9" font-size="14">Code refactoring</text>

    <rect x="350" y="360" width="160" height="64" rx="12" fill="#faf5ff" stroke="#d8b4fe" />
    <text x="430" y="387" text-anchor="middle" fill="#241b2f" font-size="18" font-weight="800">DPS</text>
    <text x="430" y="407" text-anchor="middle" fill="#7e7190" font-size="14">2024.02 – 2026.03</text>

    <rect x="538" y="312" width="144" height="56" rx="12" fill="#fff7ed" stroke="#fed7aa" />
    <text x="610" y="335" text-anchor="middle" fill="#241b2f" font-size="18" font-weight="800">DD</text>
    <text x="610" y="353" text-anchor="middle" fill="#9a6b33" font-size="14">2023.11 – 2024.11</text>

    <rect x="702" y="573" width="176" height="64" rx="12" fill="#faf5ff" stroke="#d8b4fe" />
    <text x="790" y="599" text-anchor="middle" fill="#241b2f" font-size="18" font-weight="800">SMR</text>
    <text x="790" y="621" text-anchor="middle" fill="#7e7190" font-size="14">National project</text>

    <rect x="908" y="653" width="164" height="76" rx="12" fill="#f5f3ff" stroke="#a78bfa" />
    <text x="990" y="680" text-anchor="middle" fill="#241b2f" font-size="18" font-weight="800">VIPER</text>
    <text x="990" y="700" text-anchor="middle" fill="#6d28d9" font-size="14">XTD v3 improvements applied</text>
    <text x="990" y="717" text-anchor="middle" fill="#7e7190" font-size="14">Shared Package</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14">
    <text x="680" y="480" fill="#9a6b33">DD integration added</text>
    <text x="444" y="674" fill="#8b5cf6">XTD v3 integration prepared</text>
  </g>
  </g>
</svg>

